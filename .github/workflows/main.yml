# VPS deploy, compose-style, kardeş servislerle aynı şekil (hata toparlama ucuz):
#
#   Validate        —  tüm modüllerin derleme kontrolü, kendi runner'ında.
#   Build and test  —  bağımlılıklar + `python -m pytest tests/unit -q`
#                      süiti (katalog/uygulama doğrulaması dahil), sonra repo
#                      Containerfile'ından imaj (ENV bloğu dağıtım
#                      varsayılanlarının TEK kaynağıdır) ve imaj tarball'ı +
#                      compose dosyaları koşunun artefaktı olarak yüklenir.
#   Deploy          —  SSH: kapasite ön kontrolü, imajı yükle, deploy sahipli
#                      stack.env'in HEZARFEN_TAG'ini ona çevir, compose.yaml +
#                      unit'i kur, stack'i yeniden başlat, `/health` ve
#                      `/ready` kapılarını geçir, olmazsa önceki tag'e dön.
#
# ⚠️ DEPLOY SADECE ELLE (workflow_dispatch) KOŞAR — bilinçli:
#   RAG servisi torch + BGE-M3 + reranker ister (~4,5 GB model, birkaç GB RAM)
#   ve GPU'suz bir makinede rerank 95,9 s / uçtan uca ~96 s sürer; ürün kapısı
#   O-05 p50 <= 6 s'dir. Yani aynı sunucuda backend+postgres+frontend+chatbot
#   koşarken bu servisi otomatik başlatmak, canlı stack'i RAM için sıkıştırıp
#   karşılığında ürün kapısını geçmeyen bir servis verir. Kapıyı açmadan önce
#   deploy işi RAM (>= 12 GB boşta) ve disk (>= 20 GB) ön kontrolü yapar ve
#   yetmezse NEDENİYLE birlikte reddeder.
#
# Bir seferlik ön koşullar (workflow'un erişimi dışında):
#   * repo secret'ları SSH_PRIVATE_KEY / SSH_HOST / SSH_USER;
#   * sunucuda `loginctl enable-linger <user>`;
#   * sunucuda podman + bir compose sağlayıcı;
#   * operatörün ~/hezarfen_rag/hezarfen_rag.env dosyası (şablon: .env.example)
#     ve ~/hezarfen_rag/data/ korpusu (imgeye girmez, salt-okunur bağlanır).

name: VPS deploy

on:
  push:
    branches:
      - main
  # Deploy'un TEK kapısı — yukarıdaki başlık yorumuna bakın.
  workflow_dispatch:

# Deploy serileştirmesi işin kendisinde: yeni bir push, uçuştaki VPS değişimine
# dokunmadan bayat Validate/Build'i iptal edebilmeli.

permissions:
  contents: read
  # workflow_dispatch yolu `gh run list/view` ile en yeni yeşil koşuyu arar ve o
  # koşunun artefaktini indirir; ikisi de Actions API'sidir ve YAZMA GEREKMEZ.
  actions: read

env:
  SERVICE: hezarfen_rag_compose
  DEPLOY_SUBDIR: hezarfen_rag
  ENV_FILE_NAME: hezarfen_rag.env
  # Servisin portu (imaj ENV'i ile aynı; kapı bu portu yoklar).
  PORT: "8000"
  # Kapı bütçesi: `/ready` model + korpus kurulumunu bekler. Soğuk model
  # volume'unda ilk koşu ~4,5 GB indirir; bu yüzden cömert.
  READY_TIMEOUT: "900"

jobs:
  validate:
    name: Validate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-validate
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Containerfile ile aynı satır (python:3.11-slim).
          python-version: "3.11"
      - name: Compile every module
        run: python -m compileall -q src tests

  build:
    name: Build and test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # CPU tekerleği: CI'da GPU yok ve GPU imajı ~2,5 GB daha büyük.
      - name: Install dependencies (CPU torch)
        run: |
          set -euo pipefail
          pip install --no-cache-dir "torch>=2.6" --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir --requirement requirements.txt

      # Bozuk bir build sunucuya ASLA ulaşmamalı: ölçüm kapıları ve regresyon
      # süiti burada koşar. Ortam gerektiren testler (korpus, OCR dil verisi,
      # model indirmesi) KENDİLERİ atlar ve nedenini yazar; ağır
      # integration/e2e koşumları model indirdiği için CI kapısı DEĞİLDİR —
      # bkz. README "CI deploy".
      - name: Test
        run: |
          set -euo pipefail
          pip install --no-cache-dir pytest
          python -m pytest tests/unit -q

      # Laptop ve CI aynı Containerfile'ı kullanır: ENV bloğu ne diyorsa o
      # gönderilir, ayrı bir CI ikizi yok.
      - name: Build the image
        run: |
          set -euo pipefail
          docker build -f Containerfile -t localhost/hezarfen_rag:$GITHUB_SHA .

      - name: Stage the release bundle
        run: |
          set -euo pipefail
          mkdir -p stage
          docker save localhost/hezarfen_rag:$GITHUB_SHA | gzip > stage/hezarfen_rag.tar.gz
          cp compose.yaml deploy/hezarfen_rag_compose.service stage/
          echo -n "$GITHUB_SHA" > stage/tag
          test -f stage/hezarfen_rag.tar.gz
          test -f stage/compose.yaml
          test -f stage/hezarfen_rag_compose.service
          test -f stage/tag
          ls -lh stage

      - name: Upload the release
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: stage
          retention-days: 30

  deploy:
    name: Deploy
    needs: [validate, build]
    concurrency:
      group: deploy
      cancel-in-progress: false
    # Push'ta iki CI işi koşar ama deploy KOŞMAZ (kapı elle açılır);
    # dispatch'te ikisi de atlanır ve `always()` bu atlamanın kapıyı
    # geçmesini engeller.
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (needs.validate.result == 'skipped' || needs.validate.result == 'success') &&
      (needs.build.result == 'skipped' || needs.build.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      # Elle deploy, BUILD işi yeşil olan en yeni koşuyu alır.
      - name: Find the newest green build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=""
          for rid in $(gh run list -R "$GITHUB_REPOSITORY" --workflow main.yml --branch main --event push --limit 15 --json databaseId --jq '.[].databaseId'); do
            if [ "$(gh run view -R "$GITHUB_REPOSITORY" "$rid" --json jobs --jq '.jobs[] | select(.name=="Build and test") | .conclusion')" = "success" ]; then
              run_id=$rid
              break
            fi
          done
          if [ -z "$run_id" ]; then
            echo 'no run on main has a green Build-and-test job (or its artifact has expired)' >&2
            exit 1
          fi
          echo "deploying the release from run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_ENV"

      - name: Fetch the green release
        uses: actions/download-artifact@v4
        with:
          name: release
          path: stage
          run-id: ${{ env.run_id }}
          github-token: ${{ github.token }}

      - name: Check the release is complete
        run: |
          set -euo pipefail
          test -f stage/hezarfen_rag.tar.gz
          test -f stage/compose.yaml
          test -f stage/hezarfen_rag_compose.service
          test -f stage/tag

      - name: Install SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

      - name: Upload the release
        run: |
          set -euo pipefail
          ssh_target="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh "$ssh_target" "bash -se -- '$DEPLOY_SUBDIR'" <<'REMOTE'
          set -euo pipefail
          case "$1" in
            ''|/*|*..*)
              echo "Refusing a broad deploy subdirectory: '$1'" >&2
              exit 1
              ;;
          esac
          deploy_path=$HOME/$1
          mkdir -p -- "$deploy_path"
          REMOTE
          tar -C stage -czf - hezarfen_rag.tar.gz compose.yaml hezarfen_rag_compose.service tag | ssh "$ssh_target" "bash -c 'exec tar -xzf - -C \"\$HOME/\$1\"' -- '$DEPLOY_SUBDIR'"

      - name: Load the image and restart the service
        run: |
          set -euo pipefail
          ssh_target="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh "$ssh_target" "bash -se -- '$DEPLOY_SUBDIR' '$SERVICE' '$ENV_FILE_NAME' '$PORT' '$READY_TIMEOUT'" <<'REMOTE'
          set -euo pipefail
          deploy_path=$HOME/$1
          service=$2
          env_file=$deploy_path/$3
          port=$4
          ready_timeout=$5
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          cd -- "$deploy_path"

          if [ ! -f "$env_file" ]; then
            echo "missing $env_file — create it (0600) from the repo's .env.example" >&2
            exit 1
          fi
          chmod 0600 -- "$env_file"

          # OPERATOR ORTAMI SURECE ALINIR. podman-compose interpolasyonu ORTAM
          # DEGISKENLERINE bakar ve `--env-file` YALNIZ SON dosyayi cozer
          # (podman_compose.py:2941-2946, :2559): iki dosyali cagri operator
          # dosyasini tamamen dusuruyordu. RAG'da bu "required variable ...
          # is missing" DEGIL, SESSIZ bir yanlis-korpus olarak gorunurdu:
          # compose.yaml'daki BOOK_PATH/SINIF/DERS interpolasyonu cihaz
          # varsayilanina (10/biyoloji) duser ve `environment:` env_file'i
          # ezdigi icin konteyner operatorun kitabini HIC gormez. Bu yuzden
          # dosya satir satir okunur -- kabuk genisletmesi YOK (deger icindeki
          # `$` oldugu gibi kalir), systemd `EnvironmentFile=` ile AYNI
          # davranis (satir-ici `#` korunur; bkz. unit notu).
          while IFS= read -r satir || [ -n "$satir" ]; do
            case "$satir" in ''|'#'*) continue ;; esac
            anahtar=${satir%%=*}
            deger=${satir#*=}
            case "$anahtar" in
              ''|*[!A-Za-z0-9_]*)
                echo "operator env: gecersiz anahtar adi -- harf/rakam/alt cizgi beklenirdi" >&2
                exit 1
                ;;
            esac
            export "$anahtar=$deger"
          done < "$env_file"

          # KAPASİTE ÖN KONTROLÜ — ölçülmüş gereksinim: modeller ~4,5 GB disk,
          # çalışma anında birkaç GB RAM. Yetmezse OOM ile canlı stack'i
          # düşürmek yerine burada, nedeniyle birlikte reddet.
          avail_mb=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
          disk_gb=$(df -BG --output=avail "$deploy_path" | tail -1 | tr -dc '0-9')
          if [ "$avail_mb" -lt 12000 ] || [ "$disk_gb" -lt 20 ]; then
            echo "refusing to deploy: ${avail_mb} MB RAM available (need >= 12000) and ${disk_gb} GB disk (need >= 20)." >&2
            echo 'torch + BGE-M3 + reranker need ~4.5 GB of models plus a few GB of RSS; on a GPU-less host the rerank alone measured 95.9 s (product gate O-05 wants p50 <= 6 s).' >&2
            exit 1
          fi

          command -v podman >/dev/null || {
            echo "podman not found — install podman and a compose provider (e.g. dnf install podman podman-compose)" >&2
            exit 1
          }
          podman compose version >/dev/null 2>&1 || {
            echo "'podman compose' unavailable — install a compose provider (podman-compose or docker-compose)" >&2
            exit 1
          }

          gunzip -c "$deploy_path/hezarfen_rag.tar.gz" | podman load
          tag=$(cat -- "$deploy_path/tag")

          if [ -f "$deploy_path/current_tag" ]; then
            cp -- "$deploy_path/current_tag" "$deploy_path/previous_tag"
          fi
          printf '%s\n' "$tag" > "$deploy_path/current_tag"

          # stack.env deploy sahipli (operatorun ayar dosyasindan farkli):
          # yalniz imaj tag'ini tasir ve compose'a giden TEK `--env-file` odur
          # -- operator degerleri yukarida surece alindi (EnvironmentFile= ile
          # ayni iki-kanal deseni). Iki dosyali cagri bu saglayicida operator
          # dosyasini dusurur (podman_compose.py:2941-2946, :2559); ortam
          # degiskeni --env-file degerlerini ezer (:2562).
          printf 'HEZARFEN_TAG=%s\n' "$tag" > "$deploy_path/stack.env"

          chmod 0644 -- "$deploy_path/compose.yaml" "$deploy_path/hezarfen_rag_compose.service"
          rm -f -- "$deploy_path/hezarfen_rag.tar.gz"

          compose_up() {
            podman compose --profile product --env-file "$deploy_path/stack.env" up -d --no-build
          }
          rollback() {
            if [ -f "$deploy_path/previous_tag" ]; then
              prev=$(cat -- "$deploy_path/previous_tag")
              printf 'HEZARFEN_TAG=%s\n' "$prev" > "$deploy_path/stack.env"
              printf '%s\n' "$prev" > "$deploy_path/current_tag"
              compose_up
              echo "rolled back to $prev" >&2
            else
              # İlk deploy: geri dönülecek imaj yok. `-v` YOK — model cache ve
              # maliyet defteri volume'ları korunur.
              podman compose --profile product --env-file "$deploy_path/stack.env" down
              echo 'first deploy failed; stack stopped, volumes kept' >&2
            fi
          }

          mkdir -p -- "$HOME/.config/systemd/user"
          install -m 0644 -- "$deploy_path/hezarfen_rag_compose.service" "$HOME/.config/systemd/user/$service.service"
          systemctl --user daemon-reload
          systemctl --user enable -- "$service"
          systemctl --user restart "$service" || true

          # Kapı 1 — liveness: süreç ayağa kalktı mı (boru hattı arkada kurulur).
          live_ok=0
          for _ in $(seq 1 60); do
            served=$(curl -fsS "http://127.0.0.1:$port/health" 2>/dev/null) || true
            case "$served" in
              *'"status":"ok"'*) live_ok=1; break ;;
            esac
            sleep 1
          done
          if [ "$live_ok" -ne 1 ]; then
            echo '/health never answered ok; rolling back' >&2
            podman logs --tail 30 hezarfen_rag 2>&1 >&2 || true
            rollback
            exit 1
          fi

          # Kapı 2 — readiness: boru hattı GERÇEKTEN kuruldu mu (#50: `/health`
          # servis bozukken de ok döner). Soğuk model volume'unda bu adım
          # indirmeleri bekler; bütçe READY_TIMEOUT saniyedir.
          ready_ok=0
          for _ in $(seq 1 "$ready_timeout"); do
            served=$(curl -fsS "http://127.0.0.1:$port/ready" 2>/dev/null) || true
            case "$served" in
              *'"status":"ready"'*) ready_ok=1; break ;;
            esac
            sleep 1
          done
          if [ "$ready_ok" -ne 1 ]; then
            echo "/ready never became ready within ${ready_timeout}s; rolling back" >&2
            curl -sS "http://127.0.0.1:$port/ready" >&2 || true
            podman logs --tail 30 hezarfen_rag 2>&1 >&2 || true
            rollback
            exit 1
          fi

          # Kapı 3 — OPERATOR DEGISKENLERI KONTEYNERDE MI. Bu iddia olmadan
          # iki dosyali `--env-file` sinifi sessizce geri gelebilir: `up` ya
          # reddeder ya da (varsayilani olan anahtarlarda) konteyneri SESSIZCE
          # compose varsayilaniyla ayaga kaldirirdi -- RAG'da ikincisi
          # "calisiyor gibi gorunen, yanlis kitabi okuyan servis" demektir.
          # Iki kanal, iki iddia:
          #   LLM_API_KEY dolu          -> operator dosyasi konteynere ulasti (env_file)
          #   BOOK_PATH == operatorunki -> operator degeri INTERPOLASYONA girdi
          # Deger YAZDIRILMAZ; yalniz "var ve esit" olculur. Desen `^AD=.`:
          # satir basi + en az bir karakter -- bos deger eslesmez.
          container_env=$(podman inspect -f '{{range .Config.Env}}{{println .}}{{end}}' hezarfen_rag)
          eksik=0
          for ad in LLM_API_KEY BOOK_PATH; do
            if ! printf '%s\n' "$container_env" | grep -qE "^${ad}=."; then
              echo "container env: $ad yok ya da BOS -- operator dosyasi compose'a ulasmamis" >&2
              eksik=1
            fi
          done
          op_book=$(sed -n 's/^BOOK_PATH=//p' "$env_file" | tail -1)
          if [ -n "$op_book" ]; then
            got_book=$(printf '%s\n' "$container_env" | sed -n 's/^BOOK_PATH=//p' | tail -1)
            if [ "$got_book" != "$op_book" ]; then
              echo "container BOOK_PATH operatorunkiyle AYNI DEGIL -- operator degeri interpolasyona girmemis. (Operator dosyasinda satir-ici '#' yorumu varsa systemd de onu degerin parcasi yapar; bkz. unit notu.)" >&2
              eksik=1
            fi
          fi
          if [ "$eksik" -ne 0 ]; then
            echo 'the operator env did not reach the container; rolling back' >&2
            rollback
            exit 1
          fi
          echo 'ok: operator degiskenleri konteynerde (LLM_API_KEY dolu, BOOK_PATH operatorunkiyle ayni)'
          echo 'hezarfen_rag_compose is up and ready'
          REMOTE

      - name: Verify the served service
        run: |
          set -euo pipefail
          ssh_target="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh "$ssh_target" "bash -se -- '$DEPLOY_SUBDIR' '$PORT'" <<'REMOTE'
          set -euo pipefail
          deploy_path=$HOME/$1
          port=$2
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          cd -- "$deploy_path"
          tag=$(cat -- "$deploy_path/current_tag")
          image=$(podman inspect -f '{{.Config.Image}}' hezarfen_rag)
          case "$image" in
            *"$tag"*) ;;
            *)
              echo "container runs '$image', not the current tag '$tag'" >&2
              exit 1
              ;;
          esac
          served=$(curl -fsS "http://127.0.0.1:$port/ready") || { echo '/ready failed' >&2; exit 1; }
          case "$served" in
            *'"status":"ready"'*) ;;
            *) echo "/ready did not report ready: $served" >&2; exit 1 ;;
          esac
          echo "ready; image is $image"
          REMOTE

      - name: Cleaning
        run: rm -rf ~/.ssh
